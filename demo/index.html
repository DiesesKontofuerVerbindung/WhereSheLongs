<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Blink Trigger Scene Switch — MVP</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1c1c; color: #eee; }
    #scene { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: background 0.2s; }
    #scene.room-a { background: #3a4a3a; }
    #scene.room-a-empty { background: #222; }
    button { padding: 8px 16px; font-size: 16px; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    #debug { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,0.7); padding: 12px; font-size: 13px; line-height: 1.5; white-space: pre; }
    video, canvas { display: none; }
    .hint { opacity: 0.8; max-width: 480px; text-align: center; }
  </style>
</head>
<body>
  <div id="scene" class="room-a">
    <h1 id="title">Room_A</h1>
    <p class="hint" id="hint">正常状态。先完成游戏条件，再眨眼才会切场景。</p>
    <button id="unlockBtn" type="button">模拟游戏条件（找到钥匙 / 对话结束）</button>
  </div>
  <div id="fade"></div>
  <pre id="debug"></pre>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <script type="module">
    import { BlinkController } from "../core/blink-controller.js";
    import { WebcamBlinkDetector } from "../detector/webcam-blink-detector.js";

    const sceneEl = document.getElementById("scene");
    const titleEl = document.getElementById("title");
    const hintEl = document.getElementById("hint");
    const unlockBtn = document.getElementById("unlockBtn");
    const fadeEl = document.getElementById("fade");
    const debugEl = document.getElementById("debug");

    const system = new BlinkController();
    system.configure("Room_A", "Room_A_Empty");

    let currentScene = "Room_A";
    let cameraConnected = false;
    let faceDetected = false;
    let leftEye = "unknown";
    let rightEye = "unknown";
    let lastNote = "";
    let transitioning = false;

    function renderDebug() {
      debugEl.textContent =
        "Camera: " + (cameraConnected ? "CONNECTED" : "DISCONNECTED") + "\n" +
        "Face Detected: " + (faceDetected ? "YES" : "NO") + "\n" +
        "Left Eye: " + String(leftEye).toUpperCase() + "\n" +
        "Right Eye: " + String(rightEye).toUpperCase() + "\n" +
        "Blink System: " + system.state + "\n" +
        "Blink Count: " + system.getBlinkCount() + "\n" +
        "Scene: " + currentScene + "\n" +
        (lastNote ? lastNote : "");
    }

    async function fadeSwitch(nextId) {
      transitioning = true;
      fadeEl.style.transition = "opacity 0.25s linear";
      fadeEl.style.opacity = "1";
      await new Promise((r) => setTimeout(r, 260));
      currentScene = nextId;
      sceneEl.className = nextId === "Room_A_Empty" ? "room-a-empty" : "room-a";
      titleEl.textContent = nextId;
      hintEl.textContent = nextId === "Room_A_Empty"
        ? "变化已发生。之后再眨眼也不会回到 Room_A。"
        : "";
      unlockBtn.style.display = nextId === "Room_A_Empty" ? "none" : "inline-block";
      await new Promise((r) => setTimeout(r, 80));
      fadeEl.style.opacity = "0";
      await new Promise((r) => setTimeout(r, 260));
      transitioning = false;
    }

    system.on((evt) => {
      if (evt.type === "triggered") {
        lastNote = "Blink Detected!\nTransition:\n" + evt.mainScene + "\n    ↓\n" + evt.childScene + "\nBlink System: CONSUMED";
        fadeSwitch(evt.childScene).then(() => {
          lastNote = "Blink System: TRIGGERED";
          renderDebug();
        });
      } else if (evt.type === "ignored") {
        if (evt.reason === "already_consumed") lastNote = "Blink Ignored:\nSystem already consumed.";
        else if (evt.reason === "locked") lastNote = "Blink Ignored:\nSystem still LOCKED.";
        else lastNote = "Blink Ignored:\n" + evt.reason;
      }
      renderDebug();
    });

    unlockBtn.addEventListener("click", () => {
      if (system.unlock()) {
        hintEl.textContent = "眨眼系统已解锁。请完成一次有效眨眼：睁眼 → 闭眼 → 睁眼。";
        lastNote = "Blink System: UNLOCKED";
        renderDebug();
      }
    });

    const detector = new WebcamBlinkDetector({
      video: document.getElementById("video"),
      canvas: document.getElementById("canvas"),
      onFrame: (frame) => {
        cameraConnected = frame.cameraConnected;
        faceDetected = frame.faceDetected;
        leftEye = frame.leftEye;
        rightEye = frame.rightEye;
        renderDebug();
      },
      onBlink: () => {
        if (!transitioning) system.handleBlink();
      },
    });

    renderDebug();
    detector.start().catch((err) => {
      lastNote = "Camera error: " + err.message;
      renderDebug();
    });
  </script>
</body>
</html>
