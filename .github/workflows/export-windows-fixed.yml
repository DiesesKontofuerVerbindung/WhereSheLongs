name: Export Fixed Windows Build

on:
  push:
    branches:
      - codex/20260901-export-windows-fixed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project and bundled Godot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          sparse-checkout: |
            .gitattributes
            Qimiaoye_DarkForest_TextOnly_V0.1
            tools/godot/windows
          sparse-checkout-cone-mode: false

      - name: Verify fixed story flow
        shell: powershell
        run: |
          $project = "Qimiaoye_DarkForest_TextOnly_V0.1"
          if (-not (Test-Path "$project/project.godot")) { throw "project.godot missing" }
          if (-not (Test-Path "$project/export_presets.cfg")) { throw "export_presets.cfg missing" }
          $chapter3 = Get-Content "$project/scripts/chapter3.gd" -Raw
          $main = Get-Content "$project/scripts/main.gd" -Raw
          if ($chapter3 -notmatch 'ChapterTransitionScript\.begin\(get_tree\(\), OPENING_SCENE\)') { throw "Chapter3 does not return to opening" }
          $count = ([regex]::Matches($main, 'ChapterTransitionScript\.begin\(get_tree\(\), CHAPTER3_SCENE\)')).Count
          if ($count -ne 1) { throw "Expected exactly one Forest -> Chapter3 transition, got $count" }
          Write-Host "FLOW_OK Wedding Eve -> Mystic Night -> Forest -> Chapter3 -> Opening"

      - name: Extract Godot 4.7.2 console binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
          Expand-Archive -Path "tools/godot/windows/Godot_v4.7.2-stable_win64.zip" -DestinationPath .godot-bin -Force
          $godot = Get-ChildItem .godot-bin -Filter "Godot_v4.7.2-stable_win64_console.exe" -Recurse | Select-Object -First 1
          if ($null -eq $godot) { throw "Godot 4.7.2 console executable not found" }
          & $godot.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Godot console version check failed: $LASTEXITCODE" }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and install Godot 4.7.2 export templates
        shell: powershell
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          & curl.exe -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 --progress-bar -o godot_export_templates.tpz $url
          if ($LASTEXITCODE -ne 0) { throw "Export template download failed" }
          $tpz = Get-Item godot_export_templates.tpz
          if ($tpz.Length -lt 1200000000) { throw "Export template archive suspiciously small: $($tpz.Length)" }
          $expected = "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"
          $actual = (Get-FileHash godot_export_templates.tpz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Export template SHA256 mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path .templates-unpack | Out-Null
          & 7z x godot_export_templates.tpz "-o.templates-unpack" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Export template extraction failed" }
          if (-not (Test-Path ".templates-unpack/templates/windows_release_x86_64.exe")) { throw "Windows release export template missing" }
          $target = Join-Path $env:APPDATA "Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item ".templates-unpack/templates/*" $target -Recurse -Force
          Write-Host "Templates installed at $target"

      - name: Import project resources headlessly
        shell: powershell
        run: |
          & "$env:GODOT_EXE" --headless --editor --path "Qimiaoye_DarkForest_TextOnly_V0.1" --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed with exit code $LASTEXITCODE" }

      - name: Export Windows release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path export | Out-Null
          $out = Join-Path $PWD "export/Where She Longs.exe"
          & "$env:GODOT_EXE" --headless --path "Qimiaoye_DarkForest_TextOnly_V0.1" --export-release "Gespielt Windows" "$out"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw "Exported EXE missing" }
          $item = Get-Item $out
          if ($item.Length -lt 100000000) { throw "Exported EXE suspiciously small: $($item.Length) bytes" }
          $stream = [System.IO.File]::OpenRead($out)
          try { $b0 = $stream.ReadByte(); $b1 = $stream.ReadByte() } finally { $stream.Dispose() }
          if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw "Exported file is not a Windows PE/MZ executable" }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "EXPORT_OK size=$($item.Length) sha256=$hash"
          "EXPORT_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPORT_SIZE=$($item.Length)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Split EXE for connector-safe handoff
        shell: powershell
        run: |
          $input = Join-Path $PWD "export/Where She Longs.exe"
          $chunkSize = 340MB
          $buffer = New-Object byte[] (4MB)
          $source = [System.IO.File]::OpenRead($input)
          try {
            $index = 1
            while ($source.Position -lt $source.Length) {
              $part = Join-Path $PWD ("export/WhereSheLongs-Windows.part{0:D2}" -f $index)
              $dest = [System.IO.File]::Create($part)
              try {
                $written = 0L
                while ($written -lt $chunkSize -and $source.Position -lt $source.Length) {
                  $want = [Math]::Min($buffer.Length, [Math]::Min($chunkSize - $written, $source.Length - $source.Position))
                  $read = $source.Read($buffer, 0, [int]$want)
                  if ($read -le 0) { break }
                  $dest.Write($buffer, 0, $read)
                  $written += $read
                }
              } finally { $dest.Dispose() }
              Write-Host "Created $part ($written bytes)"
              $index++
            }
          } finally { $source.Dispose() }
          Get-ChildItem export/WhereSheLongs-Windows.part* | Select-Object Name,Length | Out-Host

      - name: Write export manifest
        shell: powershell
        run: |
          @"
          Where She Longs - Windows Export
          Source branch: codex/20260901-export-windows-fixed
          Source commit: $env:GITHUB_SHA
          Godot: 4.7.2-stable
          Preset: Gespielt Windows
          EXE size: $env:EXPORT_SIZE bytes
          EXE SHA256: $env:EXPORT_SHA256
          "@ | Set-Content -Path export/EXPORT-MANIFEST.txt -Encoding UTF8

      - name: Upload complete Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Windows-Fixed
          path: |
            export/Where She Longs.exe
            export/EXPORT-MANIFEST.txt
          compression-level: 0
          retention-days: 30

      - name: Upload connector-sized part 1
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Windows-Part1
          path: export/WhereSheLongs-Windows.part01
          compression-level: 0
          retention-days: 7

      - name: Upload connector-sized part 2
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Windows-Part2
          path: export/WhereSheLongs-Windows.part02
          compression-level: 0
          retention-days: 7

      - name: Upload connector-sized part 3
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Windows-Part3
          path: export/WhereSheLongs-Windows.part03
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload connector-sized part 4 and manifest
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Windows-Part4
          path: |
            export/WhereSheLongs-Windows.part04
            export/EXPORT-MANIFEST.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
