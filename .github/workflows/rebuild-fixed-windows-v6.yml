name: Rebuild Fixed Windows V6

on:
  push:
    branches:
      - codex/20260901-rebuild-fixed-windows-v6

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull source LFS assets but exclude old EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git lfs pull --exclude="releases/windows/Where She Longs.exe"
          if ($LASTEXITCODE -ne 0) { throw "git lfs pull failed" }

      - name: Download Godot 4.7.2 editor and templates
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          $engineZip = "$env:RUNNER_TEMP\godot.zip"
          $templates = "$env:RUNNER_TEMP\templates.tpz"
          curl.exe -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 -o $engineZip "$base/Godot_v4.7.2-stable_win64.exe.zip"
          if ($LASTEXITCODE -ne 0) { throw "Godot editor download failed" }
          curl.exe -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 -o $templates "$base/Godot_v4.7.2-stable_export_templates.tpz"
          if ($LASTEXITCODE -ne 0) { throw "Godot templates download failed" }

          $engineDir = "$env:RUNNER_TEMP\godot"
          New-Item -ItemType Directory -Force $engineDir | Out-Null
          Expand-Archive $engineZip -DestinationPath $engineDir -Force
          $godot = Get-ChildItem $engineDir -Filter "Godot_v4.7.2-stable_win64_console.exe" -Recurse -File | Select-Object -First 1
          if (-not $godot) { throw "Godot console executable missing" }
          "GODOT_EXE=$($godot.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $tmp = "$env:RUNNER_TEMP\templates"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          tar -xf $templates -C $tmp
          if ($LASTEXITCODE -ne 0) { throw "Template extraction failed" }
          $dest = "$env:APPDATA\Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$tmp\templates\*" $dest -Recurse -Force
          if (-not (Test-Path "$dest\windows_release_x86_64.exe")) { throw "Windows release template missing" }
          & $godot.FullName --version

      - name: Import project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force qa-results | Out-Null
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $cmd = "$env:GODOT_EXE --headless --path $project --import > qa-results\import.log 2>&1"
          & cmd.exe /d /c $cmd
          $code = $LASTEXITCODE
          Write-Host "Import exit=$code"
          if ($code -ne 0) { Get-Content qa-results\import.log -Tail 120; throw "Import failed: $code" }
          if (-not (Test-Path "$project\.godot\global_script_class_cache.cfg")) { throw "Godot class cache missing" }

      - name: Export fixed Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $preset = Join-Path $project "export_presets.cfg"
          $text = [IO.File]::ReadAllText($preset)
          $text = $text.Replace('application/file_version="1.3.17.0"','application/file_version="1.3.18.0"')
          $text = $text.Replace('application/product_version="1.3.17.0"','application/product_version="1.3.18.0"')
          [IO.File]::WriteAllText($preset,$text,(New-Object Text.UTF8Encoding($false)))
          New-Item -ItemType Directory -Force fixed-build | Out-Null
          $out = (Join-Path $PWD "fixed-build\WhereSheLongs.exe")
          $cmd = "$env:GODOT_EXE --headless --path $project --export-release `"Gespielt Windows`" $out > qa-results\export.log 2>&1"
          & cmd.exe /d /c $cmd
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content qa-results\export.log -Tail 150; throw "Export failed: $code" }
          $size = (Get-Item $out).Length
          if ($size -lt 100000000) { throw "Exported EXE unexpectedly small: $size" }
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "GAME_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GAME_SHA256=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Game EXE $size bytes SHA256=$sha"

      - name: Smoke test fresh exported EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "fixed-build\WhereSheLongs.exe").Path
          $cmd = "$exe --headless -- --verify > qa-results\exported-smoke.log 2>&1"
          & cmd.exe /d /c $cmd
          $code = $LASTEXITCODE
          Write-Host "Smoke exit=$code"
          if ($code -ne 0) { Get-Content qa-results\exported-smoke.log -Tail 120; throw "Smoke test failed: $code" }

      - name: Build one-file offline installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          @'
          #define MyAppName "Where She Longs"
          #define MyAppVersion "1.3.18"
          [Setup]
          AppId={{8D58C9D0-2874-4C5E-96A0-D8FE08E638A1}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DisableDirPage=no
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          OutputDir=installer-output
          OutputBaseFilename=WhereSheLongs-Setup-{#MyAppVersion}
          Compression=lzma2
          SolidCompression=yes
          UseSetupLdr=yes
          UninstallDisplayIcon={app}\Where She Longs.exe
          [Files]
          Source: "fixed-build\WhereSheLongs.exe"; DestDir: "{app}"; DestName: "Where She Longs.exe"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\Where She Longs.exe"; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\Where She Longs.exe"; Description: "Launch {#MyAppName}"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content fixed-installer.iss -Encoding UTF8
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC missing" }
          & $iscc.FullName fixed-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $setup = "installer-output\WhereSheLongs-Setup-1.3.18.exe"
          if (-not (Test-Path $setup)) { throw "Installer missing" }
          $size = (Get-Item $setup).Length
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "INSTALLER_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer $size bytes SHA256=$sha"

      - name: Split installer for handoff
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force handoff | Out-Null
          $src = (Resolve-Path "installer-output\WhereSheLongs-Setup-1.3.18.exe").Path
          $input = [IO.File]::OpenRead($src)
          try {
            $buffer = New-Object byte[] 367001600
            $index = 1
            while (($read = $input.Read($buffer,0,$buffer.Length)) -gt 0) {
              $part = "handoff\WhereSheLongs-Setup-1.3.18.part{0:D2}" -f $index
              $output = [IO.File]::Create($part)
              try { $output.Write($buffer,0,$read) } finally { $output.Dispose() }
              $index++
            }
          } finally { $input.Dispose() }
          @(
            "installer_size=$env:INSTALLER_SIZE",
            "installer_sha256=$env:INSTALLER_SHA256",
            "game_size=$env:GAME_SIZE",
            "game_sha256=$env:GAME_SHA256",
            "game_source_main_commit=bc34e6108d323f8a36c94ccbe2f93fc046a65122"
          ) | Set-Content handoff\manifest.txt -Encoding UTF8
          Get-ChildItem handoff | Format-Table Name,Length -AutoSize

      - name: Upload full installer
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Setup-1.3.18-Fixed
          path: installer-output/WhereSheLongs-Setup-1.3.18.exe
          compression-level: 0
          retention-days: 30

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-Part1
          path: |
            handoff/WhereSheLongs-Setup-1.3.18.part01
            handoff/manifest.txt
          compression-level: 0
          retention-days: 7

      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-Part2
          path: handoff/WhereSheLongs-Setup-1.3.18.part02
          compression-level: 0
          retention-days: 7

      - name: Upload part 3
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-Part3
          path: handoff/WhereSheLongs-Setup-1.3.18.part03
          compression-level: 0
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-BuildLogs
          path: qa-results
          if-no-files-found: warn
          retention-days: 14
