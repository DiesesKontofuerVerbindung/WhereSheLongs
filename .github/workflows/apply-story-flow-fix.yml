name: Apply Story Flow Fix

on:
  push:
    branches:
      - codex/20260901-fix-story-flow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch chapter flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('Qimiaoye_DarkForest_TextOnly_V0.1')
          chapter3_path = root / 'scripts/chapter3.gd'
          main_path = root / 'scripts/main.gd'

          chapter3 = chapter3_path.read_text(encoding='utf-8')
          main = main_path.read_text(encoding='utf-8')

          # Final wedding chapter must return to the title screen, not loop back to Mystic Night.
          opening_const = 'const OPENING_SCENE := "res://scenes/opening/opening.tscn"\n'
          chapter_const = 'const CHAPTER_SCENE := "res://scenes/chapter3/chapter3.tscn"\n'
          if opening_const not in chapter3:
              if chapter_const not in chapter3:
                  raise SystemExit('chapter3: CHAPTER_SCENE anchor not found')
              chapter3 = chapter3.replace(chapter_const, chapter_const + opening_const, 1)

          old_ch3_end = '''    if _integrated:\n        # 集成模式下由宿主接管后续流程，不能切换宿主场景。\n        return\n    ChapterTransitionScript.begin(get_tree(), MYSTIC_NIGHT_SCENE)'''
          new_ch3_end = '''    if _integrated:\n        # 集成模式下由宿主接管后续流程，不能切换宿主场景。\n        return\n    # 最终婚礼 Demo 完成后回到开始游戏界面，结束本轮主流程。\n    ChapterTransitionScript.begin(get_tree(), OPENING_SCENE)'''
          if old_ch3_end in chapter3:
              chapter3 = chapter3.replace(old_ch3_end, new_ch3_end, 1)
          elif new_ch3_end not in chapter3:
              raise SystemExit('chapter3: final transition anchor not found')

          # Forest completion previously started ChapterTransitionScript immediately AND
          # scheduled another direct change_scene_to_file. Keep one delayed transition only.
          duplicate = '\t\tChapterTransitionScript.begin(get_tree(), CHAPTER3_SCENE)\n\n\n## 森林正片结束时切到最终章'
          if duplicate in main:
              main = main.replace(duplicate, '\n\n## 森林正片结束时切到最终章', 1)

          old_advance = '''func _advance_to_chapter3() -> void:\n\tvar delay := 0.3 if _blink_endpoint_used else 2.0\n\tawait get_tree().create_timer(delay).timeout\n\tget_tree().change_scene_to_file(CHAPTER3_SCENE)'''
          new_advance = '''func _advance_to_chapter3() -> void:\n\tvar delay := 0.3 if _blink_endpoint_used else 2.0\n\tawait get_tree().create_timer(delay).timeout\n\t# 只走一次统一章节过渡，避免 Chapter 3 被重复初始化。\n\tChapterTransitionScript.begin(get_tree(), CHAPTER3_SCENE)'''
          if old_advance in main:
              main = main.replace(old_advance, new_advance, 1)
          elif new_advance not in main:
              raise SystemExit('main: _advance_to_chapter3 anchor not found')

          # Static flow assertions: Wedding Eve -> Mystic -> Forest -> Chapter3 -> Opening.
          wedding = (root / 'scripts/wedding_prologue.gd').read_text(encoding='utf-8')
          mystic = (root / 'scripts/mystic_night.gd').read_text(encoding='utf-8')
          assert 'ChapterTransitionScript.begin(get_tree(), MYSTIC_NIGHT_SCENE)' in wedding
          assert 'ChapterTransitionScript.begin(get_tree(), FOREST_MAIN_SCENE)' in mystic
          assert main.count('ChapterTransitionScript.begin(get_tree(), CHAPTER3_SCENE)') == 1, main.count('ChapterTransitionScript.begin(get_tree(), CHAPTER3_SCENE)')
          assert 'get_tree().change_scene_to_file(CHAPTER3_SCENE)' not in main
          assert 'ChapterTransitionScript.begin(get_tree(), OPENING_SCENE)' in chapter3
          assert old_ch3_end not in chapter3

          chapter3_path.write_text(chapter3, encoding='utf-8', newline='\n')
          main_path.write_text(main, encoding='utf-8', newline='\n')
          print('Static story flow OK: Opening -> Wedding Eve -> Mystic Night -> Forest -> Chapter3 -> Opening')
          PY

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- Qimiaoye_DarkForest_TextOnly_V0.1/scripts/main.gd Qimiaoye_DarkForest_TextOnly_V0.1/scripts/chapter3.gd

      - name: Commit flow fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Qimiaoye_DarkForest_TextOnly_V0.1/scripts/main.gd Qimiaoye_DarkForest_TextOnly_V0.1/scripts/chapter3.gd
          git commit -m "fix: close main story loop at title screen"
          git push origin HEAD:codex/20260901-fix-story-flow
