name: Rebuild Fixed Windows Game

on:
  push:
    branches:
      - codex/20260901-rebuild-fixed-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Materialize source Git LFS assets
        shell: powershell
        run: |
          git lfs pull --exclude="releases/windows/Where She Longs.exe"
          $project = "Qimiaoye_DarkForest_TextOnly_V0.1/project.godot"
          if (-not (Test-Path $project)) { throw "Project missing: $project" }
          $pointerFiles = Get-ChildItem "Qimiaoye_DarkForest_TextOnly_V0.1" -File -Recurse -ErrorAction Stop | Where-Object {
            $_.Length -lt 300 -and (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match 'version https://git-lfs.github.com/spec/v1'
          }
          if ($pointerFiles.Count -gt 0) {
            $pointerFiles | Select-Object -First 20 FullName,Length | Format-Table -AutoSize
            throw "One or more project assets are still Git LFS pointers."
          }

      - name: Download Godot 4.7.2 and export templates
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          $engineZip = Join-Path $env:RUNNER_TEMP "Godot_v4.7.2-stable_win64.exe.zip"
          $templatesTpz = Join-Path $env:RUNNER_TEMP "Godot_v4.7.2-stable_export_templates.tpz"
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $engineZip
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile $templatesTpz

          $engineDir = Join-Path $env:RUNNER_TEMP "godot-4.7.2"
          New-Item -ItemType Directory -Force $engineDir | Out-Null
          Expand-Archive -LiteralPath $engineZip -DestinationPath $engineDir -Force

          $templateExtract = Join-Path $env:RUNNER_TEMP "godot-templates"
          New-Item -ItemType Directory -Force $templateExtract | Out-Null
          tar -xf $templatesTpz -C $templateExtract

          $templateDest = Join-Path $env:APPDATA "Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force $templateDest | Out-Null
          $templateSource = Join-Path $templateExtract "templates"
          if (-not (Test-Path (Join-Path $templateSource "windows_release_x86_64.exe"))) {
            throw "Windows export template not found after extraction."
          }
          Copy-Item (Join-Path $templateSource "*") $templateDest -Recurse -Force

          $godot = Get-ChildItem $engineDir -Filter "Godot_v4.7.2-stable_win64_console.exe" -File -Recurse | Select-Object -First 1
          if (-not $godot) {
            $godot = Get-ChildItem $engineDir -Filter "Godot_v4.7.2-stable_win64.exe" -File -Recurse | Select-Object -First 1
          }
          if (-not $godot) { throw "Godot 4.7.2 executable not found." }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $godot.FullName --version

      - name: Run chapter verification suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $checks = @(
            @{ Name = "opening"; Scene = "res://scenes/opening/opening.tscn"; Extra = @("--verify") },
            @{ Name = "wedding"; Scene = "res://scenes/wedding/wedding_prologue.tscn"; Extra = @("--verify") },
            @{ Name = "mystic"; Scene = "res://scenes/mystic_night/mystic_night.tscn"; Extra = @("--verify") },
            @{ Name = "forest"; Scene = "res://main.tscn"; Extra = @("--verify") },
            @{ Name = "chapter3-A"; Scene = "res://scenes/chapter3/chapter3.tscn"; Extra = @("--verify", "--choice=A") },
            @{ Name = "chapter3-B"; Scene = "res://scenes/chapter3/chapter3.tscn"; Extra = @("--verify", "--choice=B") },
            @{ Name = "chapter3-C"; Scene = "res://scenes/chapter3/chapter3.tscn"; Extra = @("--verify", "--choice=C") }
          )
          New-Item -ItemType Directory -Force "qa-results" | Out-Null
          $rows = @()
          foreach ($check in $checks) {
            $stdout = "qa-results/$($check.Name).stdout.log"
            $stderr = "qa-results/$($check.Name).stderr.log"
            $args = @("--headless", "--path", $project, "--scene", $check.Scene, "--") + $check.Extra
            $p = Start-Process -FilePath $env:GODOT_EXE -ArgumentList $args -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $done = $p.WaitForExit(120000)
            if (-not $done) {
              try { $p.Kill() } catch {}
              $rows += [pscustomobject]@{ Check=$check.Name; Status="TIMEOUT"; ExitCode="" }
              continue
            }
            $status = if ($p.ExitCode -eq 0) { "PASS" } else { "FAIL" }
            $rows += [pscustomobject]@{ Check=$check.Name; Status=$status; ExitCode=$p.ExitCode }
          }
          $rows | Format-Table -AutoSize
          $rows | Export-Csv "qa-results/summary.csv" -NoTypeInformation -Encoding UTF8
          if (@($rows | Where-Object { $_.Status -ne "PASS" }).Count -gt 0) {
            throw "Chapter verification failed."
          }

      - name: Export fresh Windows executable from fixed source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $buildDir = Join-Path $PWD "fixed-build"
          New-Item -ItemType Directory -Force $buildDir | Out-Null
          $gameExe = Join-Path $buildDir "Where She Longs.exe"
          & $env:GODOT_EXE --headless --path $project --export-release "Gespielt Windows" $gameExe
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $gameExe)) { throw "Exported game EXE missing." }
          $size = (Get-Item $gameExe).Length
          if ($size -lt 100000000) { throw "Exported game EXE is unexpectedly small: $size bytes" }
          $sha = (Get-FileHash $gameExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "GAME_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GAME_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Fresh game export: $size bytes / SHA256 $sha"

      - name: Smoke test exported executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "fixed-build/Where She Longs.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList @("--headless", "--verify") -PassThru -NoNewWindow -RedirectStandardOutput "qa-results/exported.stdout.log" -RedirectStandardError "qa-results/exported.stderr.log"
          $done = $p.WaitForExit(120000)
          if (-not $done) {
            try { $p.Kill() } catch {}
            throw "Exported executable smoke test timed out."
          }
          if ($p.ExitCode -ne 0) { throw "Exported executable smoke test failed: $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build single-file offline installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @'
          #define MyAppName "Where She Longs"
          #define MyAppVersion "1.3.18"
          #define MyAppExeName "Where She Longs.exe"

          [Setup]
          AppId={{8D58C9D0-2874-4C5E-96A0-D8FE08E638A1}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableDirPage=no
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          OutputDir=installer-output
          OutputBaseFilename=WhereSheLongs-Setup-{#MyAppVersion}
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayIcon={app}\{#MyAppExeName}
          CloseApplications=yes
          RestartApplications=no
          UseSetupLdr=yes

          [Files]
          Source: "fixed-build\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path "fixed-installer.iss" -Encoding UTF8

          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found." }
          & $iscc.FullName "fixed-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $setup = "installer-output/WhereSheLongs-Setup-1.3.18.exe"
          if (-not (Test-Path $setup)) { throw "Installer output missing." }
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          "INSTALLER_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer: $size bytes / SHA256 $sha"

      - name: Create handoff chunks and manifest
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = (Resolve-Path "installer-output/WhereSheLongs-Setup-1.3.18.exe").Path
          $out = Join-Path $PWD "handoff"
          New-Item -ItemType Directory -Force $out | Out-Null
          $chunkSize = 350MB
          $input = [System.IO.File]::OpenRead($src)
          try {
            $buffer = New-Object byte[] $chunkSize
            $index = 1
            while (($read = $input.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $part = Join-Path $out ("WhereSheLongs-Setup-1.3.18.part{0:D2}" -f $index)
              $stream = [System.IO.File]::Create($part)
              try { $stream.Write($buffer, 0, $read) } finally { $stream.Dispose() }
              $index++
            }
          } finally { $input.Dispose() }
          @(
            "installer=WhereSheLongs-Setup-1.3.18.exe",
            "installer_size=$env:INSTALLER_SIZE",
            "installer_sha256=$env:INSTALLER_SHA256",
            "game_size=$env:GAME_SIZE",
            "game_sha256=$env:GAME_SHA256",
            "source_commit=$env:GITHUB_SHA"
          ) | Set-Content "handoff/manifest.txt" -Encoding UTF8
          Get-ChildItem handoff | Format-Table Name,Length -AutoSize

      - name: Upload full fixed installer
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Setup-1.3.18-Fixed
          path: installer-output/WhereSheLongs-Setup-1.3.18.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload handoff part 1
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Fixed-Part1
          path: |
            handoff/WhereSheLongs-Setup-1.3.18.part01
            handoff/manifest.txt
          compression-level: 0
          retention-days: 7

      - name: Upload handoff part 2
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Fixed-Part2
          path: handoff/WhereSheLongs-Setup-1.3.18.part02
          compression-level: 0
          retention-days: 7

      - name: Upload handoff part 3
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Fixed-Part3
          path: handoff/WhereSheLongs-Setup-1.3.18.part03
          compression-level: 0
          retention-days: 7

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Fixed-QA
          path: qa-results
          if-no-files-found: warn
          retention-days: 14
