name: Split Built Installer For Handoff

on:
  push:
    branches:
      - codex/20260901-windows-installer

permissions:
  actions: read
  contents: read

jobs:
  split-installer:
    runs-on: windows-latest
    steps:
      - name: Download successful installer artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\installer" | Out-Null
          gh run download 33469131726 `
            --repo DiesesKontofuerVerbindung/WhereSheLongs `
            --name WhereSheLongs-Setup-1.3.17 `
            --dir "$env:RUNNER_TEMP\installer"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "WhereSheLongs-Setup-1.3.17.exe" -Recurse | Select-Object -First 1
          if ($null -eq $setup) { throw "Built installer not found after artifact download." }
          Write-Host "SETUP_PATH=$($setup.FullName)"
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Split installer into connector-sized chunks
        shell: powershell
        run: |
          $source = $env:SETUP_PATH
          $out = "$env:RUNNER_TEMP\parts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $chunkSize = 350MB
          $buffer = New-Object byte[] (4MB)
          $input = [System.IO.File]::OpenRead($source)
          try {
            $index = 1
            while ($input.Position -lt $input.Length) {
              $part = Join-Path $out ("WhereSheLongs-Setup-1.3.17.exe.part{0}" -f $index)
              $output = [System.IO.File]::Create($part)
              try {
                $remaining = [Math]::Min($chunkSize, $input.Length - $input.Position)
                while ($remaining -gt 0) {
                  $toRead = [Math]::Min($buffer.Length, $remaining)
                  $read = $input.Read($buffer, 0, [int]$toRead)
                  if ($read -le 0) { break }
                  $output.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally {
                $output.Dispose()
              }
              $index++
            }
          } finally {
            $input.Dispose()
          }
          Get-ChildItem $out | Format-Table Name,Length
          if ((Get-ChildItem $out).Count -ne 3) { throw "Expected exactly 3 installer chunks." }

      - name: Upload installer part 1
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Setup-Part1
          path: ${{ runner.temp }}/parts/WhereSheLongs-Setup-1.3.17.exe.part1
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer part 2
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Setup-Part2
          path: ${{ runner.temp }}/parts/WhereSheLongs-Setup-1.3.17.exe.part2
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer part 3
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Setup-Part3
          path: ${{ runner.temp }}/parts/WhereSheLongs-Setup-1.3.17.exe.part3
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
