name: Rebuild Fixed Windows V4

on:
  push:
    branches:
      - codex/20260901-rebuild-fixed-windows-v4

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 70

    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull project LFS assets, excluding old packaged EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git lfs pull --exclude="releases/windows/Where She Longs.exe"
          if ($LASTEXITCODE -ne 0) { throw "git lfs pull failed" }
          if (-not (Test-Path "Qimiaoye_DarkForest_TextOnly_V0.1/project.godot")) { throw "project.godot missing" }

      - name: Normalize non-Windows export preset for headless import
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $preset = "Qimiaoye_DarkForest_TextOnly_V0.1/export_presets.cfg"
          $text = [IO.File]::ReadAllText($preset)
          $needle = "export_filter=`"resources`"`r`ninclude_filter="
          if (-not $text.Contains($needle)) {
            $needle = "export_filter=`"resources`"`ninclude_filter="
            if ($text.Contains($needle)) {
              $text = $text.Replace($needle, "export_filter=`"resources`"`nexport_files=PackedStringArray()`ninclude_filter=", 1)
            }
          } else {
            $text = $text.Replace($needle, "export_filter=`"resources`"`r`nexport_files=PackedStringArray()`r`ninclude_filter=", 1)
          }
          [IO.File]::WriteAllText($preset, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Fetch Godot 4.7.2 editor
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          $zip = "$env:RUNNER_TEMP\godot.zip"
          curl.exe -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 -o $zip "$base/Godot_v4.7.2-stable_win64.exe.zip"
          if ($LASTEXITCODE -ne 0) { throw "Godot download failed" }
          $dir = "$env:RUNNER_TEMP\godot"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Expand-Archive $zip -DestinationPath $dir -Force
          $godot = Get-ChildItem $dir -Filter "Godot_v4.7.2-stable_win64_console.exe" -Recurse -File | Select-Object -First 1
          if (-not $godot) { throw "Godot console executable missing" }
          "GODOT_EXE=$($godot.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $godot.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Godot version probe failed" }

      - name: Import Godot project resources
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force qa-results | Out-Null
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $ErrorActionPreference = "Continue"
          & $env:GODOT_EXE --headless --path $project --import *> "qa-results/import.log"
          $code = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          Write-Host "Godot import exit=$code"
          if ($code -ne 0) { Get-Content "qa-results/import.log" -Tail 120; throw "Godot import failed: $code" }
          if (-not (Test-Path "$project\.godot\global_script_class_cache.cfg")) { throw "global script class cache missing after import" }
          $count = @(Get-ChildItem "$project\.godot\imported" -File -ErrorAction SilentlyContinue).Count
          Write-Host "Imported resource files: $count"
          if ($count -lt 100) { throw "Too few imported resources: $count" }

      - name: Verify seven story entry points
        shell: powershell
        run: |
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $checks = @(
            @{Name="opening";Scene="res://scenes/opening/opening.tscn";Args=@("--verify")},
            @{Name="wedding";Scene="res://scenes/wedding/wedding_prologue.tscn";Args=@("--verify")},
            @{Name="mystic";Scene="res://scenes/mystic_night/mystic_night.tscn";Args=@("--verify")},
            @{Name="forest";Scene="res://main.tscn";Args=@("--verify")},
            @{Name="chapter3-A";Scene="res://scenes/chapter3/chapter3.tscn";Args=@("--verify","--choice=A")},
            @{Name="chapter3-B";Scene="res://scenes/chapter3/chapter3.tscn";Args=@("--verify","--choice=B")},
            @{Name="chapter3-C";Scene="res://scenes/chapter3/chapter3.tscn";Args=@("--verify","--choice=C")}
          )
          $rows = @()
          foreach ($check in $checks) {
            $allArgs = @("--headless","--path",$project,"--scene",$check.Scene,"--") + $check.Args
            $log = "qa-results/$($check.Name).log"
            $ErrorActionPreference = "Continue"
            & $env:GODOT_EXE @allArgs *> $log
            $code = $LASTEXITCODE
            $ErrorActionPreference = "Stop"
            $status = if ($code -eq 0) { "PASS" } else { "FAIL" }
            $rows += [pscustomobject]@{Check=$check.Name;Status=$status;ExitCode=$code}
            Write-Host "$($check.Name): $status ($code)"
            if ($code -ne 0) { Get-Content $log -Tail 100 }
          }
          $rows | Format-Table -AutoSize
          $rows | Export-Csv "qa-results/summary.csv" -NoTypeInformation -Encoding UTF8
          if (@($rows | Where-Object { $_.Status -ne "PASS" }).Count -gt 0) { throw "Story verification failed" }

      - name: Fetch Godot 4.7.2 export templates
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          $tpz = "$env:RUNNER_TEMP\templates.tpz"
          curl.exe -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 -o $tpz "$base/Godot_v4.7.2-stable_export_templates.tpz"
          if ($LASTEXITCODE -ne 0) { throw "Export templates download failed" }
          $tmp = "$env:RUNNER_TEMP\templates"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          tar -xf $tpz -C $tmp
          if ($LASTEXITCODE -ne 0) { throw "Export templates extraction failed" }
          $dest = "$env:APPDATA\Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$tmp\templates\*" $dest -Recurse -Force
          if (-not (Test-Path "$dest\windows_release_x86_64.exe")) { throw "Windows release template missing" }

      - name: Export fresh fixed Windows EXE
        shell: powershell
        run: |
          $project = (Resolve-Path "Qimiaoye_DarkForest_TextOnly_V0.1").Path
          $preset = Join-Path $project "export_presets.cfg"
          $text = [IO.File]::ReadAllText($preset)
          $text = $text.Replace('application/file_version="1.3.17.0"','application/file_version="1.3.18.0"')
          $text = $text.Replace('application/product_version="1.3.17.0"','application/product_version="1.3.18.0"')
          [IO.File]::WriteAllText($preset,$text,(New-Object Text.UTF8Encoding($false)))
          New-Item -ItemType Directory -Force fixed-build | Out-Null
          $out = (Join-Path $PWD "fixed-build\Where She Longs.exe")
          $ErrorActionPreference = "Continue"
          & $env:GODOT_EXE --headless --path $project --export-release "Gespielt Windows" $out *> "qa-results/export.log"
          $code = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($code -ne 0) { Get-Content "qa-results/export.log" -Tail 150; throw "Godot export failed: $code" }
          if (-not (Test-Path $out)) { throw "Fresh EXE missing" }
          $size = (Get-Item $out).Length
          if ($size -lt 100000000) { throw "Fresh EXE unexpectedly small: $size" }
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "GAME_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GAME_SHA256=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Fresh EXE $size bytes SHA256=$sha"

      - name: Smoke test exported EXE
        shell: powershell
        run: |
          $exe = (Resolve-Path "fixed-build\Where She Longs.exe").Path
          $ErrorActionPreference = "Continue"
          & $exe --headless --verify *> "qa-results/exported.log"
          $code = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          Write-Host "Exported EXE smoke exit=$code"
          if ($code -ne 0) { Get-Content "qa-results/exported.log" -Tail 120; throw "Exported EXE smoke test failed: $code" }

      - name: Build offline setup EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          @'
          #define MyAppName "Where She Longs"
          #define MyAppVersion "1.3.18"
          #define MyAppExeName "Where She Longs.exe"
          [Setup]
          AppId={{8D58C9D0-2874-4C5E-96A0-D8FE08E638A1}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DisableDirPage=no
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          OutputDir=installer-output
          OutputBaseFilename=WhereSheLongs-Setup-{#MyAppVersion}
          Compression=lzma2
          SolidCompression=yes
          UseSetupLdr=yes
          UninstallDisplayIcon={app}\{#MyAppExeName}
          [Files]
          Source: "fixed-build\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content fixed-installer.iss -Encoding UTF8
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC missing" }
          & $iscc.FullName fixed-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed" }
          $setup = "installer-output\WhereSheLongs-Setup-1.3.18.exe"
          if (-not (Test-Path $setup)) { throw "Installer missing" }
          $size = (Get-Item $setup).Length
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "INSTALLER_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Setup $size bytes SHA256=$sha"

      - name: Split setup for ChatGPT handoff
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force handoff | Out-Null
          $src = (Resolve-Path "installer-output\WhereSheLongs-Setup-1.3.18.exe").Path
          $input = [IO.File]::OpenRead($src)
          try {
            $buf = New-Object byte[] 367001600
            $i = 1
            while (($read = $input.Read($buf,0,$buf.Length)) -gt 0) {
              $file = "handoff\WhereSheLongs-Setup-1.3.18.part{0:D2}" -f $i
              $o = [IO.File]::Create($file)
              try { $o.Write($buf,0,$read) } finally { $o.Dispose() }
              $i++
            }
          } finally { $input.Dispose() }
          @(
            "installer_size=$env:INSTALLER_SIZE",
            "installer_sha256=$env:INSTALLER_SHA256",
            "game_size=$env:GAME_SIZE",
            "game_sha256=$env:GAME_SHA256",
            "source_commit=$env:GITHUB_SHA"
          ) | Set-Content handoff\manifest.txt -Encoding UTF8
          Get-ChildItem handoff | Format-Table Name,Length -AutoSize

      - name: Upload full installer
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-Setup-1.3.18-Fixed
          path: installer-output/WhereSheLongs-Setup-1.3.18.exe
          compression-level: 0
          retention-days: 30

      - name: Upload handoff part 1
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-Part1
          path: |
            handoff/WhereSheLongs-Setup-1.3.18.part01
            handoff/manifest.txt
          compression-level: 0
          retention-days: 7

      - name: Upload handoff part 2
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-Part2
          path: handoff/WhereSheLongs-Setup-1.3.18.part02
          compression-level: 0
          retention-days: 7

      - name: Upload handoff part 3
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-Part3
          path: handoff/WhereSheLongs-Setup-1.3.18.part03
          compression-level: 0
          retention-days: 7

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhereSheLongs-1.3.18-QA
          path: qa-results
          if-no-files-found: warn
          retention-days: 14
