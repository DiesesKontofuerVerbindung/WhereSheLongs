<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时眨眼检测</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    video, canvas { width: 100%; max-height: 360px; background: #111; border-radius: 8px; }
    .stage { position: relative; max-width: 640px; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
    canvas { display: block; height: auto; }
    .row { display: flex; gap: 12px; margin: 12px 0; align-items: center; flex-wrap: wrap; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    .stats { line-height: 1.6; }
    .hint { color: #555; font-size: 14px; }
    #summary { margin-top: 12px; padding: 12px; background: #f3f3f3; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>实时眨眼检测</h1>
  <p class="hint">画面只在本机浏览器处理，不会上传。请正对摄像头、光线充足。</p>
  <div class="row">
    <button id="startBtn" type="button">开始测试</button>
    <button id="stopBtn" type="button" disabled>结束测试</button>
  </div>
  <div class="stats">
    <div>状态：<strong id="statusText">未开始</strong></div>
    <div>眼睛：<strong id="eyeText">—</strong></div>
    <div>眨眼次数：<strong id="countText">0</strong></div>
    <div>已用时间：<strong id="timeText">0.0 秒</strong></div>
  </div>
  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="summary"></div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/+esm";

    const LEFT_EYE = [33, 160, 158, 133, 153, 144];
    const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
    const CLOSE_EAR = 0.19;
    const OPEN_EAR = 0.23;
    const MIN_CLOSED_FRAMES = 3;
    const MIN_OPEN_FRAMES = 2;
    const COOLDOWN_MS = 180;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusText = document.getElementById("statusText");
    const eyeText = document.getElementById("eyeText");
    const countText = document.getElementById("countText");
    const timeText = document.getElementById("timeText");
    const summary = document.getElementById("summary");

    let landmarker = null;
    let stream = null;
    let running = false;
    let rafId = 0;
    let timerId = 0;
    let startedAt = 0;
    let blinkCount = 0;
    let phase = "need_open";
    let closedFrames = 0;
    let openFrames = 0;
    let lastBlinkAt = 0;
    let eyeLabel = "—";

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function eyeAspectRatio(lm, idx) {
      const p1 = lm[idx[0]];
      const p2 = lm[idx[1]];
      const p3 = lm[idx[2]];
      const p4 = lm[idx[3]];
      const p5 = lm[idx[4]];
      const p6 = lm[idx[5]];
      const vertical = dist(p2, p6) + dist(p3, p5);
      const horizontal = dist(p1, p4);
      if (horizontal < 1e-6) return 1;
      return vertical / (2 * horizontal);
    }

    async function loadModel() {
      if (landmarker) return;
      statusText.textContent = "正在加载检测模型…";
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm"
      );
      const modelUrl =
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";
      const options = (delegate) => ({
        baseOptions: { modelAssetPath: modelUrl, delegate },
        runningMode: "VIDEO",
        numFaces: 1,
      });
      try {
        landmarker = await FaceLandmarker.createFromOptions(fileset, options("GPU"));
      } catch (e) {
        landmarker = await FaceLandmarker.createFromOptions(fileset, options("CPU"));
      }
    }

    function resetCounters() {
      blinkCount = 0;
      phase = "need_open";
      closedFrames = 0;
      openFrames = 0;
      lastBlinkAt = 0;
      eyeLabel = "—";
      countText.textContent = "0";
      eyeText.textContent = "—";
      timeText.textContent = "0.0 秒";
      summary.style.display = "none";
    }

    function updateBlink(ear, now) {
      if (ear < CLOSE_EAR) {
        closedFrames += 1;
        openFrames = 0;
        if (closedFrames >= MIN_CLOSED_FRAMES) {
          eyeLabel = "闭眼";
          if (phase === "open") phase = "closed";
        }
        return;
      }

      if (ear > OPEN_EAR) {
        openFrames += 1;
        closedFrames = 0;
        if (openFrames >= MIN_OPEN_FRAMES) {
          eyeLabel = "睁眼";
          if (phase === "closed" && now - lastBlinkAt >= COOLDOWN_MS) {
            blinkCount += 1;
            lastBlinkAt = now;
            countText.textContent = String(blinkCount);
          }
          phase = "open";
        }
        return;
      }

      // 介于开合阈值之间：保持当前判定，避免抖动重复计数
    }

    function drawFrame(landmarks) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.save();
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);
      if (landmarks) {
        ctx.fillStyle = "#00e676";
        for (const i of LEFT_EYE.concat(RIGHT_EYE)) {
          const p = landmarks[i];
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function loop() {
      if (!running) return;
      if (video.readyState >= 2) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
        }
        const result = landmarker.detectForVideo(video, performance.now());
        const face = result.faceLandmarks && result.faceLandmarks[0];
        if (face) {
          const ear = (eyeAspectRatio(face, LEFT_EYE) + eyeAspectRatio(face, RIGHT_EYE)) / 2;
          updateBlink(ear, performance.now());
          statusText.textContent = "检测中";
          eyeText.textContent = eyeLabel;
          drawFrame(face);
        } else {
          closedFrames = 0;
          openFrames = 0;
          statusText.textContent = "未检测到人脸";
          eyeText.textContent = "—";
          drawFrame(null);
        }
      }
      rafId = requestAnimationFrame(loop);
    }

    function tickTime() {
      if (!running) return;
      const sec = (Date.now() - startedAt) / 1000;
      timeText.textContent = sec.toFixed(1) + " 秒";
    }

    async function startTest() {
      startBtn.disabled = true;
      summary.style.display = "none";
      try {
        await loadModel();
        statusText.textContent = "正在请求摄像头权限…";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        resetCounters();
        running = true;
        startedAt = Date.now();
        stopBtn.disabled = false;
        statusText.textContent = "检测中";
        timerId = setInterval(tickTime, 100);
        loop();
      } catch (err) {
        console.error(err);
        statusText.textContent = "无法启动：" + (err && err.message ? err.message : String(err));
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    }

    function stopTest() {
      running = false;
      cancelAnimationFrame(rafId);
      clearInterval(timerId);
      if (stream) {
        for (const track of stream.getTracks()) track.stop();
        stream = null;
      }
      video.srcObject = null;
      const duration = (Date.now() - startedAt) / 1000;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusText.textContent = "已结束";
      summary.style.display = "block";
      summary.innerHTML =
        "<strong>测试结束</strong><br>持续时间：" +
        duration.toFixed(1) +
        " 秒<br>总眨眼次数：" +
        blinkCount;
    }

    startBtn.addEventListener("click", startTest);
    stopBtn.addEventListener("click", stopTest);
  </script>
</body>
</html>
